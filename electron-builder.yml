appId: io.github.lumacut
productName: Lumacut
afterPack: build/after-pack.cjs
copyright: Copyright © 2026 Hosea Felix Sanjaya
directories:
  output: release/${version}
  buildResources: resources
files:
  - out/**
  - resources/icons/icon.png
  - package.json
  - '!**/*.map'
  # Transformers.js bundles the web runtime it needs; the package itself is browser-only.
  - '!node_modules/onnxruntime-web/**'
extraResources:
  - from: resources/bin/${platform}-${arch}
    to: bin
    filter: ['ffmpeg', 'ffprobe', 'ffmpeg.exe', 'ffprobe.exe', 'FFMPEG_LICENSE.txt']
  - from: LICENSE
    to: LICENSE
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: CHANGELOG.md
    to: CHANGELOG.md
asarUnpack:
  - resources/icons/icon.png
  # Native modules load from real files, not from inside the archive.
  - node_modules/onnxruntime-node/**
  - node_modules/onnxruntime-common/**
  - node_modules/sharp/**
  - node_modules/@img/**
# Electron features Lumacut doesn't need are switched off in the binary itself.
electronFuses:
  # Kept on: the MCP stdio bridge runs as plain Node (ELECTRON_RUN_AS_NODE).
  runAsNode: true
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # Kept on: the app's own page and its modules load from file://.
  grantFileProtocolExtraPrivileges: true
  # Unsigned Apple silicon builds need a fresh ad-hoc signature after the fuses change.
  resetAdHocDarwinSignature: true
fileAssociations:
  - ext: lumacut
    name: Lumacut project
    description: Lumacut project
    mimeType: application/x-lumacut
    role: Editor
publish:
  provider: github
  owner: Pascalllllll
  repo: Lumacut-video-editor-
  releaseType: release

linux:
  target:
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64, arm64]
    - target: AppImage
      arch: [x64, arm64]
    - target: tar.gz
      arch: [x64, arm64]
  icon: resources/icons/linux
  category: AudioVideo
  maintainer: Hosea Felix Sanjaya <felix190606@gmail.com>
  vendor: Lumacut
  synopsis: Free desktop video editor
  description: Edit video on your own computer. No account, no watermark, no paid tier.
  executableArgs: ['--ozone-platform-hint=auto']
  mimeTypes: [application/x-lumacut]
  desktop:
    entry:
      Name: Lumacut
      GenericName: Video Editor
      Comment: Edit video on your own computer
      Keywords: video;editor;edit;cut;timeline;
      StartupWMClass: Lumacut
      Categories: AudioVideo;Video;AudioVideoEditing;
deb:
  artifactName: Lumacut_${version}_${arch}.${ext}
  depends:
    - libgtk-3-0t64 | libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0t64 | libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libgbm1
    - libasound2t64 | libasound2
rpm:
  artifactName: Lumacut-${version}.${arch}.${ext}
  depends:
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - libXtst
    - xdg-utils
    - at-spi2-core
    - libuuid
    - libsecret
appImage:
  artifactName: Lumacut-${version}-${arch}.${ext}
flatpak:
  runtimeVersion: '24.08'
  baseVersion: '24.08'
  finishArgs:
    - --share=ipc
    - --socket=x11
    - --socket=wayland
    - --socket=pulseaudio
    - --device=dri
    - --filesystem=home
    - --talk-name=org.freedesktop.secrets
    - --talk-name=org.freedesktop.Notifications

win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64, arm64]
  icon: resources/icons/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: Lumacut-Setup-${version}-${arch}.${ext}
portable:
  artifactName: Lumacut-Portable-${version}-${arch}.${ext}

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.video
  icon: resources/icons/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/mac/entitlements.plist
  entitlementsInherit: resources/mac/entitlements.plist
  notarize: false
dmg:
  artifactName: Lumacut-${version}-${arch}.${ext}
