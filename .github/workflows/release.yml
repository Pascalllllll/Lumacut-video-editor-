name: Release

# Runs when a version tag such as v1.0.0 is pushed. Builds every package on its
# own platform, then publishes one GitHub Release with all of them, their
# SHA-256 checksums and the files the in-app updater reads.
#
# Signing is optional. Without these secrets the packages are built unsigned:
#   Windows and macOS:  CSC_LINK (base64 .p12/.pfx), CSC_KEY_PASSWORD
#   macOS notarization: APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
# Google sign-in is built in only with GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET
# (a "Desktop app" OAuth client); without them Settings has no Account section.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - name: Tag matches package.json and CHANGELOG.md
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME}" > /dev/null
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  linux:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - name: Packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # x64 and arm64 in one run; electron-builder cross-builds the arm64 packages.
      - run: pnpm dist:linux -- --publish=never
        env:
          LUMACUT_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          LUMACUT_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux
          if-no-files-found: error
          path: |
            release/*/*.deb
            release/*/*.rpm
            release/*/*.AppImage
            release/*/*.tar.gz
            release/*/latest-linux*.yml

  flatpak:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - name: Flatpak tools and the Flathub remote
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist:flatpak -- --publish=never
        env:
          LUMACUT_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          LUMACUT_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flatpak
          if-no-files-found: error
          path: release/*/*.flatpak

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Use the signing certificate if there is one
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "CSC_LINK=$CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi
      - run: pnpm dist:win -- --publish=never
        env:
          LUMACUT_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          LUMACUT_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          if-no-files-found: error
          path: |
            release/*/*.exe
            release/*/*.exe.blockmap
            release/*/latest.yml

  mac:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Use the signing certificate and notarization if there are any
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "CSC_LINK=$CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_ID" ]; then
            echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
            echo "MAC_NOTARIZE=-c.mac.notarize=true" >> "$GITHUB_ENV"
          fi
      - run: pnpm dist:mac -- --publish=never $MAC_NOTARIZE
        env:
          LUMACUT_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          LUMACUT_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac
          if-no-files-found: error
          path: |
            release/*/*.dmg
            release/*/*.zip
            release/*/*.blockmap
            release/*/latest-mac.yml

  publish:
    needs: [linux, flatpak, windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true
      - name: Collect files and checksums
        run: |
          mkdir upload
          find artifacts -type f -exec mv {} upload/ \;
          cd upload
          sha256sum $(ls | grep -v '\.yml$' | grep -v '\.blockmap$') > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME}" > notes.md
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" upload/* \
            --title "Lumacut ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --verify-tag
