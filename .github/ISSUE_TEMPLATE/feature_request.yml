name: Feature request
description: Suggest something Lumacut should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: Describe the edit or task, not the button you'd add.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: In Lumacut or another editor.
