name: Bug report
description: Something doesn't work the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Import a 4K HEVC clip
        2. Drag it to the timeline
        3. ...
  - type: input
    id: version
    attributes:
      label: Lumacut version
      description: Settings > About shows it.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and GPU
      placeholder: Debian testing, GNOME on Wayland, Intel + NVIDIA
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: On Linux, ~/.config/Lumacut/logs/. Remove anything private first.
      render: text
